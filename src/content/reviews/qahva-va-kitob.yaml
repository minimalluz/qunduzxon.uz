summary:
  uz: Тинч бурчак, ажойиб флэт уайт ва уйда пиширилган чизкейк. Иш ёки учрашув учун қулай.
  ru: Тихий уголок, отличный флэт уайт и домашний чизкейк. Удобно для работы и встреч.
body:
  uz: |-
    Тонгни яхши қаҳва билан бошлашни яхши кўраман. Бу жойда бариста ўз ишини жуда яхши билади.

    Десертлардан чизкейк ва миндаль круассанни албатта татиб кўринг.
  ru: |-
    Люблю начинать утро с хорошего кофе. Бариста здесь отлично знает своё дело.

    Из десертов обязательно попробуйте чизкейк и миндальный круассан.
