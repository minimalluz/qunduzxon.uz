summary:
  uz: Ҳақиқий тўй оши таъми, самимий хизмат ва оилавий муҳит. Якшанба тушлиги учун энг яхши танлов.
  ru: Вкус настоящего свадебного плова, душевный сервис и семейная атмосфера. Лучший выбор для воскресного обеда.
body:
  uz: |-
    Бугун мен сизни шаҳримиздаги энг самимий миллий ресторанлардан бирига олиб бораман. Кириш билан ўчоқдан чиққан ноннинг ҳиди кутиб олади.

    Ош — ресторан визит карточкаси. Гуруч донадор, гўшт юмшоқ, зиравор меъёрида. Қазиси алоҳида мақтовга лойиқ.

    Хизмат тез ва хушмуомала, фақат дам олиш кунлари олдиндан стол банд қилишни маслаҳат бераман.
  ru: |-
    Сегодня я веду вас в один из самых душевных национальных ресторанов нашего города. С порога встречает аромат лепёшек из тандыра.

    Плов — визитная карточка заведения. Рис рассыпчатый, мясо мягкое, специй в меру. Отдельной похвалы заслуживает казы.

    Обслуживание быстрое и вежливое, но в выходные советую бронировать стол заранее.
