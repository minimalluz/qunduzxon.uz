body:
  uz: |-
    Турк ошхонасини севувчилар учун яхши манзил. Искандар кабоб сершира, соус меъёрида.

    Интерьер оддий, лекин тоза. Кечқурунлари одам кўп бўлади.
  ru: |-
    Хорошее место для любителей турецкой кухни. Искандер-кебаб сочный, соуса в меру.

    Интерьер простой, но чистый. По вечерам бывает многолюдно.
