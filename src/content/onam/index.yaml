intro:
  uz: Ҳаётимдаги энг қимматли инсон, менга ҳаёт берган, тарбиялаган ва доимо қўллаб-қувватлаган меҳрибон онажоним ҳақида.
  ru: О самом дорогом человеке в моей жизни — моей любимой маме, которая подарила мне жизнь, воспитала и всегда поддерживала меня.
values:
  - { uz: Меҳр 🤲, ru: Любовь 🤲 }
  - { uz: Дуо 💐, ru: Молитва 💐 }
  - { uz: Ҳурмат, ru: Уважение }
quote:
  uz: Она — бу дунёдаги энг муқаддас сўз, она меҳри — энг буюк неъмат.
  ru: Мама — самое святое слово на свете, а материнская любовь — величайший дар.
story:
  uz: |-
    Менинг онам — ҳаётимдаги энг муҳим инсон. У менга фақат ҳаёт бергани эмас, балки ҳаётда тўғри йўлни топишга, меҳрибон ва ғамхўр бўлишга ўргатди.

    Онамнинг меҳри ва қўллаб-қувватлаши туфайли мен бугунги кунда ўз орзуларимга эришдим. Унинг ҳар бир маслаҳати, ҳар бир дуоси мен учун бебаҳо.

    Раҳмат, онажон! Сизни жуда яхши кўраман! ❤️
  ru: |-
    Моя мама — самый важный человек в моей жизни. Она не только подарила мне жизнь, но и научила находить верный путь, быть доброй и заботливой.

    Благодаря маминой любви и поддержке сегодня я достигла своих мечтаний. Каждый её совет, каждая её молитва для меня бесценны.

    Спасибо, мамочка! Я тебя очень люблю! ❤️
