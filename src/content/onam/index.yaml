intro:
  uz: Ҳаётимдаги энг қимматли инсон, менга ҳаёт берган, тарбиялаган ва доимо қўллаб-қувватлаган меҳрибон онажоним ҳақида.
  ru: О самом дорогом человеке в моей жизни — моей любимой маме, которая подарила мне жизнь, воспитала и всегда поддерживала меня.
values:
  - { uz: Меҳр 🤲, ru: Любовь 🤲 }
  - { uz: Дуо 💐, ru: Молитва 💐 }
  - { uz: Ҳурмат, ru: Уважение }
quote:
  uz: Она — бу дунёдаги энг муқаддас сўз, она меҳри — энг буюк неъмат.
  ru: Мама — самое святое слово на свете, а материнская любовь — величайший дар.
story:
  uz: |-
    Менинг онам — ҳаётимдаги энг муҳим инсон. У менга фақат ҳаёт бергани эмас, балки ҳаётда тўғри йўлни топишга, меҳрибон ва ғамхўр бўлишга ўргатди.

    Онамнинг меҳри ва қўллаб-қувватлаши туфайли мен бугунги кунда ўз орзуларимга эришдим. Унинг ҳар бир маслаҳати, ҳар бир дуоси мен учун бебаҳо.

    Онам Тошкентдаги зиёли оиланинг қизи, консерваторияни тамомлаган мусиқачи. Мен олти ёшга тўлганимда ота-онам ажрашди ва онам уч фарзандини — акам, мен ва укамни олиб Фарғонага, ота-онасининг ҳовлисига кўчиб борди.

    90-йилларнинг оғир кунларида мактабдаги мусиқа дарсларидан ташқари бозорда мева ва нон сотиб бўлса ҳам, бизни ҳеч кимдан кам қилмади ва ҳаммамизни олий маълумотли қилди.

    Онам қаттиққўл, ғурурли ва принципиал инсон. Энг муҳими — у бизни отамизга нафрат билан эмас, ҳурмат руҳида катта қилди. Менга бувимнинг — онамнинг онасининг исми қўйилган.

    Раҳмат, онажон! Сизни жуда яхши кўраман! ❤️
  ru: |-
    Моя мама — самый важный человек в моей жизни. Она не только подарила мне жизнь, но и научила находить верный путь, быть доброй и заботливой.

    Благодаря маминой любви и поддержке сегодня я достигла своих мечтаний. Каждый её совет, каждая её молитва для меня бесценны.

    Мама — дочь интеллигентной ташкентской семьи, выпускница консерватории, музыкант. Когда мне было шесть лет, родители развелись, и мама с тремя детьми — старшим братом, мной и младшим братом — переехала в Фергану, в дом своих родителей.

    В трудные девяностые, кроме уроков музыки в школе, она даже продавала на рынке фрукты и хлеб, но растила нас не хуже других и всем нам дала высшее образование.

    Мама — строгий, гордый и принципиальный человек. И главное — она воспитала нас не в обиде на отца, а в уважении к нему. Меня назвали в честь бабушки — маминой мамы.

    Спасибо, мамочка! Я тебя очень люблю! ❤️
