  text:
    uz: Сиз менинг ҳаётимдаги энг катта неъматсиз. Аллоҳ сизга узоқ умр ва саломатлик берсин!
    ru: Вы — самый большой дар в моей жизни. Пусть Всевышний дарует вам долгих лет жизни и крепкого здоровья!
