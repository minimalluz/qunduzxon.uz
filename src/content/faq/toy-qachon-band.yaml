question: "Санани қанча олдин банд қилиш керак?"
questionRu: "За сколько заранее бронировать дату?"
answer:
  uz: "Мавсумда (май–октябрь) 2–3 ой олдин банд қилишни тавсия қиламан. Бўш санани формадан тез текширишингиз мумкин."
  ru: "В сезон (май–октябрь) рекомендую бронировать за 2–3 месяца. Свободную дату можно быстро проверить через форму."
