question: "Тўйни икки тилда олиб борасизми?"
questionRu: "Ведёте ли свадьбу на двух языках?"
answer:
  uz: "Ҳа, ўзбек ва рус тилларида эркин олиб бораман. Меҳмонлар таркибига қараб нисбатни келишамиз."
  ru: "Да, свободно веду на узбекском и русском. Соотношение языков согласуем по составу гостей."
