bio:
  uz: |-
    Ассалому алайкум! Мен — Қундузхон Абдуллаева: теле ва радио бошловчи, нотиқлик санъати бўйича тренер, тўй ва тантаналар бошловчиси ва блогерман.

    16 йилдан бери эфирдаман: журналистикани «Сўғдиёна» газетасидан бошлаганман, кейин радио ва телеканалларда кўрсатувлар олиб бордим, минглаб тингловчи ва томошабинлар билан ҳар куни учрашдим.

    Бугун тўйлар, корпоратив тадбирлар ва расмий маросимларни олиб бораман, нотиқлик бўйича маҳорат дарслари ўтказаман, рекламаларни овозлаштираман ва фуд-блогимда Ўзбекистон таомлари ҳақида ҳикоя қиламан.

    Мен учун энг муҳими — тоза ва чиройли нутқ, самимий мулоқот ва ҳар бир инсонга ҳурмат. Бўш вақтимда фитнес, бокс ва муай-тай билан шуғулланаман, бадиий ва психологик аудиокитоблар тинглайман.
  ru: |-
    Ассалому алайкум! Я — Кундузхон Абдуллаева: теле- и радиоведущая, тренер по ораторскому искусству, ведущая свадеб и торжеств, блогер.

    Я в эфире уже 16 лет: начинала в журналистике с газеты «Сугдиёна», затем вела передачи на радио и телеканалах, каждый день встречалась с тысячами слушателей и зрителей.

    Сегодня я веду свадьбы, корпоративные мероприятия и официальные церемонии, провожу мастер-классы по ораторскому искусству, озвучиваю рекламу, а в своём фуд-блоге рассказываю о блюдах Узбекистана.

    Для меня главное — чистая и красивая речь, искреннее общение и уважение к каждому человеку. В свободное время занимаюсь фитнесом, боксом и муай-тай, слушаю художественные и психологические аудиокниги.
timeline:
  - year: ''
    title: { uz: 'Санъаткорлар оиласида', ru: 'В семье артистов' }
    text: { uz: 'Отаси — Ўзбекистонда хизмат кўрсатган артист, бастакор, профессор Рустам Абдуллаев; онаси — консерваторияни тамомлаган мусиқа ўқитувчиси. Болалиги Фарғонада ўтган.', ru: 'Отец — заслуженный артист Узбекистана, композитор, профессор Рустам Абдуллаев; мама — выпускница консерватории, преподаватель музыки. Детство прошло в Фергане.' }
  - year: ''
    title: { uz: 'Мусиқа мактаби', ru: 'Музыкальная школа' }
    text: { uz: 'Мактаб йилларида мусиқа мактабида 7 йил фортепиано ва 5 йил дутор бўйича ўқиган, хор ва сольфеджио дарсларига қатнашган.', ru: 'В школьные годы 7 лет училась в музыкальной школе по классу фортепиано и 5 лет — дутора, занималась хором и сольфеджио.' }
  - year: ''
    title: { uz: 'Сўз ва микрофон', ru: 'Слово и микрофон' }
    text: { uz: 'Мусиқачилик йўлидан кетиш имконияти бўлса-да, инглиз тили йўналишидаги академик лицейни, кейин микрофон қаршисида сўзлашга иштиёқи сабаб олийгоҳда журналистикани танлаган.', ru: 'Хотя могла стать музыкантом, выбрала академический лицей с углублённым английским, а затем — из любви к работе у микрофона — журналистику в вузе.' }
  - year: ''
    title: { uz: 'Матбуот мактаби', ru: 'Школа печати' }
    text: { uz: 'Журналистик фаолиятини «Сўғдиёна» газетасида бошлаган: устозлари журналистнинг қалами ва тили аввало матбуотда чархланишини уқтирган.', ru: 'Начала журналистский путь в газете «Сугдиёна»: наставники учили, что перо и речь журналиста оттачиваются прежде всего в печати.' }
  - year: ''
    title: { uz: 'Радио', ru: 'Радио' }
    text: { uz: 'Узоқ йиллар радиода жонли эфирлар олиб борган: Zamin FM, Hit FM, 90.8 FM ва «Ёшлар» радиоси. Эфирлар ва тадбирларда кўпинча ҳамкасби Озод Равшан билан бирга чиққан.', ru: 'Много лет вела прямые эфиры на радио: Zamin FM, Hit FM, 90.8 FM и радио «Ёшлар». В эфирах и на мероприятиях часто выступала вместе с коллегой Озодом Равшаном.' }
  - year: ''
    title: { uz: 'Milliy TV', ru: 'Milliy TV' }
    text: { uz: '«Миллий» телеканалида маърифий ва кўнгилочар кўрсатувлар олиб борган, жумладан «Ширчой» тонгги кўрсатуви.', ru: 'Вела просветительские и развлекательные передачи на телеканале «Миллий», в том числе утреннее шоу «Ширчой».' }
  - year: ''
    title: { uz: '«Севимли» телеканали', ru: 'Телеканал «Севимли»' }
    text: { uz: 'Муаллифлик ва кўнгилочар лойиҳалар, шоу ва ток-шоулар, жумладан «Bollivud battl». Ҳозирда «Sevimli kun» ва ток-шоуларда бошловчи.', ru: 'Авторские и развлекательные проекты, шоу и ток-шоу, в том числе «Bollivud battl». Сейчас — ведущая «Sevimli kun» и ток-шоу.' }
  - year: ''
    title: { uz: 'Эксперт ва суҳбатдош', ru: 'Эксперт и собеседник' }
    text: { uz: '«Ёшлар» ва бошқа миллий телеканаллар кўрсатувларида («Жамулжам» ва бошқалар) доимий эксперт ва суҳбатдош.', ru: 'Постоянный эксперт и собеседник в передачах телеканала «Ёшлар» и других национальных каналов («Жамулжам» и др.).' }
  - year: ''
    title: { uz: 'Нотиқлик тренери', ru: 'Тренер по ораторскому искусству' }
    text: { uz: 'Аудитория олдида эркин сўзлаш, овозни тўғри қўйиш, дикция ва ҳаяжонни енгиш бўйича маҳорат дарслари ва тренинглар ўтказади.', ru: 'Проводит мастер-классы и тренинги: свободная речь перед аудиторией, постановка голоса, дикция, преодоление волнения.' }
  - year: ''
    title: { uz: 'Аёллар учун курслар', ru: 'Курсы для женщин' }
    text: { uz: 'Хотин-қизларнинг жамиятдаги ўрни, психологик мустақиллиги, муомала маданияти ва нутқ техникаси бўйича муаллифлик курслари.', ru: 'Авторские курсы о роли женщины в обществе, психологической независимости, культуре общения и технике речи.' }
  - year: ''
    title: { uz: 'Ёшлар билан', ru: 'Работа с молодёжью' }
    text: { uz: 'Журналистика талабаларига телерадио бошловчилиги бўйича маҳорат дарслари; Ўзбекистон давлат санъат ва маданият институти каби олийгоҳларда медиа маданияти, нутқ санъати ва ижтимоий тармоқлар мавзусида амалий учрашувлар.', ru: 'Мастер-классы по теле- и радиоведению для студентов-журналистов; практические встречи со студентами вузов, например Государственного института искусств и культуры Узбекистана, о медиакультуре, искусстве речи и роли соцсетей.' }
  - year: ''
    title: { uz: 'Блогер', ru: 'Блогер' }
    text: { uz: 'Ижтимоий тармоқларда ярим миллионга яқин кузатувчи. Шахсий ривожланиш, оилавий қадриятлар, аёллар руҳияти ва муомала маданияти ҳақида видео ва фикрлар.', ru: 'Почти полмиллиона подписчиков в соцсетях. Видео и размышления о личностном росте, семейных ценностях, женской психологии и культуре общения.' }
  - year: ''
    title: { uz: 'Фуд-блог', ru: 'Фуд-блог' }
    text: { uz: 'Ўзбекистон бўйлаб ресторан ва миллий таомлар ҳақида ҳалол шарҳлар, пазандалик рецептлари.', ru: 'Честные обзоры ресторанов и национальных блюд по всему Узбекистану, кулинарные рецепты.' }
values:
  - title: { uz: Самимийлик, ru: Искренность }
    text: { uz: Ҳар бир сўз юракдан ва ўз ўрнида., ru: Каждое слово — от сердца и к месту. }
  - title: { uz: Тайёргарлик, ru: Подготовка }
    text: { uz: 'Сценарий, меҳмонлар ва деталлар олдиндан келишилади.', ru: 'Сценарий, гости и детали согласуются заранее.' }
  - title: { uz: Холислик, ru: Честность }
    text: { uz: 'Фуд-шарҳларда фақат ўз фикрим, реклама алоҳида белгиланади.', ru: 'В обзорах только моё мнение, реклама всегда помечается.' }
