bio:
  uz: |-
    Микрофон олдида биринчи марта турганимда қўлларим титраган эди. Бугун эса ҳар бир эфир, ҳар бир тўй ва ҳар бир тадбир мен учун одамлар билан самимий суҳбат.

    Телевидение ва радиода ишлаб, мен энг муҳим нарсани ўргандим: томошабин ёлғонни дарров сезади. Шунинг учун ҳар доим самимий, тайёргарлик билан ва ҳурмат билан ишлайман.

    Бугун мен тўй ва тантаналарни олиб бораман, корпоратив тадбирлар ва бренд тақдимотларида бошловчиман, реклама роликларини овозлаштираман ҳамда фуд-блогер сифатида Тошкентнинг энг яхши ресторанларини сиз учун холис баҳолайман.
  ru: |-
    Когда я впервые встала перед микрофоном, у меня дрожали руки. Сегодня каждый эфир, каждая свадьба и каждое мероприятие для меня — искренний разговор с людьми.

    Работая на телевидении и радио, я усвоила главное: зритель сразу чувствует фальшь. Поэтому я всегда работаю искренне, подготовленно и с уважением.

    Сегодня я веду свадьбы и торжества, корпоративные мероприятия и презентации брендов, озвучиваю рекламу, а как фуд-блогер — честно оцениваю для вас лучшие рестораны Ташкента.
